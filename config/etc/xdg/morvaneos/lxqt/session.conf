# MorvaneOS defaults: LXQt's session.conf with the MorvaneOS settings, from morvane-lxqt-theme (tools/build.py).
[General]
leave_confirmation=true
window_manager=openbox

[Environment]
GTK_CSD=0
GTK_OVERLAY_SCROLLING=0

[Mouse]
cursor_size=24
cursor_theme=sandrone-linux
acc_factor=20
acc_threshold=10
left_handed=false

[Keyboard]
delay=500
interval=30
beep=false

[Font]
antialias=true
hinting=true
dpi=96
