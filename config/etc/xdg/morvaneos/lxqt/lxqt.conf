# MorvaneOS defaults: LXQt's lxqt.conf with the MorvaneOS settings, from morvane-lxqt-theme (tools/build.py).
[General]
theme=morvane-dark
icon_theme=candy-icons
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon
palette_override=true

[Qt]
font="Sans,11,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
style=Fusion
wheelScrollLines=3

[Palette]
window_color=#1A1220
window_text_color=#F5EEF3
base_color=#120C16
text_color=#F5EEF3
highlight_color=#F4A6C6
highlighted_text_color=#120C16
link_color=#B9A3E6
link_visited_color=#C9A0D8
tooltip_base_color=#221828
tooltip_text_color=#F5EEF3
